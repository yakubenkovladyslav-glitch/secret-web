<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Media Vault</title>
    <link rel="stylesheet" href="style.css">
    <!-- This file is generated by your Python script or edited by you -->
    <script src="media_list.js"></script>
</head>
<body>

    <!-- LOGIN SECTION -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Private Access</h2>
            <form onsubmit="handleLogin(event)">
                <input type="password" id="password-input" placeholder="Enter Password" autofocus>
                <button type="submit">Unlock</button>
            </form>
            <p id="error-msg" class="error-msg">Access Denied</p>
        </div>
    </div>

    <!-- LIGHTBOX (The Player) -->
    <div id="lightbox">
        <div class="lb-controls">
            <span class="close-btn" onclick="closeLightbox()">&times;</span>
            <div class="lb-counter"><span id="lb-current">1</span> / <span id="lb-total">0</span></div>
        </div>

        <div class="nav-area prev" onclick="changeMedia(-1)">&#10094;</div>
        <div class="nav-area next" onclick="changeMedia(1)">&#10095;</div>

        <div id="lightbox-wrapper">
            <div class="spinner" id="lb-spinner"></div>
            
            <!-- Image Player -->
            <img id="lightbox-img" draggable="false" style="display:none;">
            
            <!-- Local Video Player -->
            <video id="lightbox-video" controls style="display:none;"></video>
            
            <!-- YouTube/PH/Embed Player -->
            <iframe id="lightbox-yt" width="100%" height="100%" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen style="display:none; border:none;"></iframe>
            
            <!-- Music Player -->
            <div id="lightbox-audio-container" style="display:none;">
                <div class="audio-icon" style="font-size: 80px; margin-bottom: 20px;">🎵</div>
                <audio id="lightbox-audio" controls></audio>
            </div>
        </div>
    </div>

    <!-- MAIN GALLERY -->
    <main id="gallery-content" style="display:none;">
        <header>
            <h1>My Collection (<span id="count">0</span>)</h1>
            <div class="category-tabs">
                <button id="btn-images" class="tab-btn active" onclick="filterMedia('images')">Images</button>
                <button id="btn-videos" class="tab-btn" onclick="filterMedia('videos')">Videos</button>
                <button id="btn-music" class="tab-btn" onclick="filterMedia('music')">Music</button>
            </div>
        </header>
        <div class="media-grid" id="grid-container"></div>
    </main>

    <script>
        // CONFIG
        const folderPath = "private-media/";
        // Password hash for "admin" (You can change this password in the script)
        const AUTH_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

        let currentIndex = 0;
        let filteredMediaList = []; 
        
        const fileCategories = {
            images: ['jpg', 'jpeg', 'png', 'webp', 'gif'],
            videos: ['mp4', 'webm', 'mov', 'avi'],
            music: ['mp3', 'wav', 'ogg', 'm4a']
        };

        // --- 1. AUTO-CONVERTER LOGIC ---
        function formatMediaURL(url) {
            if (!url.startsWith('http')) return folderPath + url;

            // YouTube Auto-Convert
            if (url.includes('youtube.com/watch?v=')) {
                const id = url.split('v=')[1].split('&')[0];
                return `https://www.youtube.com/embed/${id}`;
            }
            if (url.includes('youtu.be/')) {
                const id = url.split('/').pop();
                return `https://www.youtube.com/embed/${id}`;
            }

            // Pornhub Auto-Convert
            if (url.includes('pornhub.com/view_video.php?viewkey=')) {
                const id = url.split('viewkey=')[1].split('&')[0];
                return `https://www.pornhub.com/embed/${id}`;
            }

            return url; 
        }

        function getFileType(filename) {
            if (filename.includes('youtube.com') || filename.includes('youtu.be') || filename.includes('pornhub.com')) {
                return 'videos';
            }
            const cleanName = filename.split('?')[0];
            const ext = cleanName.split('.').pop().toLowerCase();
            if (fileCategories.images.includes(ext)) return 'images';
            if (fileCategories.videos.includes(ext)) return 'videos';
            if (fileCategories.music.includes(ext)) return 'music';
            return 'other';
        }

        function getThumbnail(url) {
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                const id = url.split('/').pop().split('?')[0];
                return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
            }
            return null;
        }

        // --- 2. AUTHENTICATION ---
        async function handleLogin(e) {
            e.preventDefault();
            const input = document.getElementById("password-input").value;
            const msgBuffer = new TextEncoder().encode(input);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashHex === AUTH_HASH) {
                document.getElementById("login-overlay").style.display = "none";
                document.getElementById("gallery-content").style.display = "block";
                loadGallery();
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        // --- 3. GALLERY RENDERER ---
        function loadGallery() {
            if (typeof mediaList === 'undefined') {
                alert("media_list.js not found! Run scan_files.py or create it.");
                return;
            }
            filterMedia('images');
        }

        function filterMedia(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');
            filteredMediaList = mediaList.filter(file => getFileType(file) === type);
            renderGrid();
        }

        function renderGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = ""; 
            document.getElementById('count').innerText = filteredMediaList.length;
            document.getElementById('lb-total').innerText = filteredMediaList.length;

            filteredMediaList.forEach((filename, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                const fileType = getFileType(filename);
                const displayURL = formatMediaURL(filename);

                const ytThumb = getThumbnail(displayURL);
                if (ytThumb) {
                    const img = document.createElement('img');
                    img.src = ytThumb;
                    card.appendChild(img);
                } else if (fileType === 'videos') {
                    const vid = document.createElement('video');
                    vid.src = displayURL;
                    vid.muted = true;
                    card.appendChild(vid);
                } else if (fileType === 'music') {
                    card.innerHTML = `<div class="audio-card">🎵<span>${filename.split('/').pop()}</span></div>`;
                } else {
                    const img = document.createElement('img');
                    img.src = displayURL;
                    card.appendChild(img);
                }

                card.onclick = () => openLightbox(index);
                container.appendChild(card);
            });
        }

        // --- 4. LIGHTBOX PLAYER LOGIC ---
        const lbImg = document.getElementById('lightbox-img');
        const lbVid = document.getElementById('lightbox-video');
        const lbYT = document.getElementById('lightbox-yt');
        const lbAudio = document.getElementById('lightbox-audio');
        const lbAudioCont = document.getElementById('lightbox-audio-container');
        const lbSpinner = document.getElementById('lb-spinner');

        function openLightbox(index) {
            currentIndex = index;
            document.getElementById('lightbox').style.display = "flex";
            updateLightboxContent();
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = "none";
            lbVid.pause(); lbVid.src = "";
            lbYT.src = ""; 
            lbAudio.pause();
        }

        function changeMedia(dir) {
            currentIndex = (currentIndex + dir + filteredMediaList.length) % filteredMediaList.length;
            updateLightboxContent();
        }

        function updateLightboxContent() {
            const rawPath = filteredMediaList[currentIndex];
            const convertedPath = formatMediaURL(rawPath);
            const type = getFileType(rawPath);
            const isEmbed = rawPath.includes('youtube.com') || rawPath.includes('youtu.be') || rawPath.includes('pornhub.com');

            document.getElementById('lb-current').innerText = currentIndex + 1;
            lbSpinner.style.display = "block";
            
            // Hide all players initially
            lbImg.style.display = "none";
            lbVid.style.display = "none";
            lbYT.style.display = "none";
            lbAudioCont.style.display = "none";
            lbVid.pause(); lbYT.src = "";

            if (isEmbed) {
                lbYT.style.display = "block";
                lbYT.src = convertedPath;
                lbSpinner.style.display = "none";
            } else if (type === 'videos') {
                lbVid.style.display = "block";
                lbVid.src = convertedPath;
                lbVid.onloadeddata = () => lbSpinner.style.display = "none";
            } else if (type === 'music') {
                lbAudioCont.style.display = "flex";
                lbAudio.src = convertedPath;
                lbAudio.play().catch(() => {});
                lbSpinner.style.display = "none";
            } else {
                lbImg.style.display = "block";
                lbImg.src = convertedPath;
                lbImg.onload = () => lbSpinner.style.display = "none";
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('lightbox').style.display === "flex") {
                if (e.key === "ArrowLeft") changeMedia(-1);
                if (e.key === "ArrowRight") changeMedia(1);
                if (e.key === "Escape") closeLightbox();
            }
        });
    </script>
</body>
</html>
