<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Precise Media Gallery</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load the list generated by Python -->
    <script src="media_list.js"></script>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Private Access</h2>
            <form onsubmit="handleLogin(event)">
                <input type="password" id="password-input" placeholder="Enter Password" autofocus>
                <button type="submit">Unlock</button>
            </form>
            <p id="error-msg" class="error-msg">Access Denied</p>
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div id="lightbox">
        <!-- Controls -->
        <div class="lb-controls">
            <span class="close-btn" onclick="closeLightbox()">&times;</span>
            <div class="lb-counter"><span id="lb-current">1</span> / <span id="lb-total">0</span></div>
        </div>

        <!-- Navigation Areas -->
        <div class="nav-area prev" onclick="changeMedia(-1)">&#10094;</div>
        <div class="nav-area next" onclick="changeMedia(1)">&#10095;</div>

        <!-- Content Container -->
        <div id="lightbox-wrapper">
            <div class="spinner" id="lb-spinner"></div>
            <img id="lightbox-img" draggable="false" alt="Gallery Item" style="display:none;">
            <video id="lightbox-video" controls style="display:none;"></video>
            
            <!-- Added Audio Player Container -->
            <div id="lightbox-audio-container" style="display:none;">
                <div class="audio-icon">🎵</div>
                <audio id="lightbox-audio" controls></audio>
            </div>
        </div>
    </div>

    <!-- GALLERY GRID -->
    <main id="gallery-content" style="display:none;">
        <header>
            <h1>Collection (<span id="count">0</span>)</h1>
            <!-- Added Category Tabs -->
            <div class="category-tabs">
                <button id="btn-images" class="tab-btn active" onclick="filterMedia('images')">Images</button>
                <button id="btn-videos" class="tab-btn" onclick="filterMedia('videos')">Videos</button>
                <button id="btn-gifs" class="tab-btn" onclick="filterMedia('gifs')">GIFs</button>
                <button id="btn-music" class="tab-btn" onclick="filterMedia('music')">Music</button>
            </div>
        </header>
        <div class="media-grid" id="grid-container"></div>
    </main>

    <script>
        // CONFIG
        const folderPath = "private-media/";
        const AUTH_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

        let currentIndex = 0;
        let filteredMediaList =[]; // Holds items of the currently selected tab
        
        // Allowed extensions per category
        const fileCategories = {
            images: ['jpg', 'jpeg', 'png', 'webp'],
            videos: ['mp4', 'webm', 'mov', 'avi'],
            gifs: ['gif'],
            music: ['mp3', 'wav', 'ogg', 'flac', 'm4a']
        };

        // --- 1. AUTHENTICATION ---
        async function handleLogin(e) {
            e.preventDefault();
            const input = document.getElementById("password-input").value;
            const errorMsg = document.getElementById("error-msg");

            if (input === "4321") {
                window.location.href = "visualizer/visualizer.html";
                return;
            }

            const msgBuffer = new TextEncoder().encode(input);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashHex === AUTH_HASH) {
                document.getElementById("login-overlay").style.display = "none";
                document.getElementById("gallery-content").style.display = "block";
                loadGallery();
            } else {
                errorMsg.style.display = "block";
                document.getElementById("password-input").value = "";
            }
        }

        // --- 2. GALLERY LOADER & FILTERING ---
        function getFileType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (fileCategories.images.includes(ext)) return 'images';
            if (fileCategories.videos.includes(ext)) return 'videos';
            if (fileCategories.gifs.includes(ext)) return 'gifs';
            if (fileCategories.music.includes(ext)) return 'music';
            return 'other';
        }

        function loadGallery() {
            if (typeof mediaList === 'undefined') {
                alert("Error: Run scan_files.py first!");
                return;
            }
            // Load 'images' tab by default
            filterMedia('images');
        }

        function filterMedia(type) {
            // Update Tab Button Styles
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');

            // Filter main list
            filteredMediaList = mediaList.filter(file => getFileType(file) === type);

            // Re-render
            renderGrid();
        }

        function renderGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = ""; // Clear existing grid

            document.getElementById('count').innerText = filteredMediaList.length;
            document.getElementById('lb-total').innerText = filteredMediaList.length;

            filteredMediaList.forEach((filename, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const fileType = getFileType(filename);
                const fullPath = folderPath + filename;

                if (fileType === 'videos') {
                    const mediaEl = document.createElement('video');
                    mediaEl.src = fullPath + "#t=0.1";
                    mediaEl.preload = "metadata";
                    mediaEl.className = "lazy grid-video";
                    card.appendChild(mediaEl);

                } else if (fileType === 'music') {
                    const audioDiv = document.createElement('div');
                    audioDiv.className = "audio-card";
                    audioDiv.innerHTML = `🎵<span>${filename}</span>`;
                    card.appendChild(audioDiv);

                } else {
                    // Images & GIFs
                    const mediaEl = document.createElement('img');
                    mediaEl.dataset.src = fullPath;
                    mediaEl.className = "lazy";
                    mediaEl.loading = "lazy";
                    card.appendChild(mediaEl);
                }

                card.onclick = () => openLightbox(index);
                container.appendChild(card);
            });

            initLazyLoading();
        }

        function initLazyLoading() {
            const targets = document.querySelectorAll(".lazy");
            const obs = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const el = entry.target;
                        if(el.tagName === 'IMG') el.src = el.dataset.src;
                        el.classList.remove("lazy");
                        observer.unobserve(el);
                    }
                });
            });
            targets.forEach(t => obs.observe(t));
        }

        // --- 3. LIGHTBOX LOGIC ---
        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');
        const lbVid = document.getElementById('lightbox-video');
        const lbAudio = document.getElementById('lightbox-audio');
        const lbAudioContainer = document.getElementById('lightbox-audio-container');
        const lbSpinner = document.getElementById('lb-spinner');
        
        let transformState = { scale: 1, x: 0, y: 0 };
        let isDragging = false;
        let startPos = { x: 0, y: 0 };

        function openLightbox(index) {
            if (filteredMediaList.length === 0) return;
            currentIndex = index;
            lightbox.style.display = "flex";
            updateLightboxContent();
            document.addEventListener('keydown', handleKeyInput);
        }

        function closeLightbox() {
            lightbox.style.display = "none";
            lbVid.pause();
            lbVid.src = "";
            lbAudio.pause();
            lbAudio.src = "";
            document.removeEventListener('keydown', handleKeyInput);
        }

        function changeMedia(direction) {
            if (filteredMediaList.length === 0) return;
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = filteredMediaList.length - 1;
            if (currentIndex >= filteredMediaList.length) currentIndex = 0;
            updateLightboxContent();
        }

        function updateLightboxContent() {
            resetZoom();
            if (filteredMediaList.length === 0) return;

            const filename = filteredMediaList[currentIndex];
            const fullPath = folderPath + filename;
            const fileType = getFileType(filename);

            document.getElementById('lb-current').innerText = currentIndex + 1;
            lbSpinner.style.display = "block";

            // Hide/Pause all players initially
            lbImg.style.display = "none";
            lbVid.style.display = "none";
            lbAudioContainer.style.display = "none";
            lbVid.pause();
            lbAudio.pause();

            if (fileType === 'videos') {
                lbVid.style.display = "block";
                lbVid.src = fullPath;
                lbVid.onloadstart = () => { lbSpinner.style.display = "none"; };

            } else if (fileType === 'music') {
                lbAudioContainer.style.display = "flex";
                lbAudio.src = fullPath;
                lbAudio.play();
                lbSpinner.style.display = "none"; // Hide spinner immediately for audio

            } else {
                // Images and GIFs
                lbImg.style.display = "block";
                lbImg.src = fullPath;
                lbImg.onload = () => { lbSpinner.style.display = "none"; };
            }
        }

        function handleKeyInput(e) {
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") changeMedia(-1);
            if (e.key === "ArrowRight") changeMedia(1);
        }

        // --- 4. TOUCH & ZOOM LOGIC ---
        let lastTap = 0;
        lightbox.addEventListener('touchend', function (e) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                if (transformState.scale > 1) resetZoom();
                else {
                    transformState.scale = 2.5;
                    updateTransform();
                }
                e.preventDefault();
            }
            lastTap = currentTime;
        });

        lightbox.addEventListener('wheel', (e) => {
            // Prevent zoom if video or audio is displayed
            if(lbVid.style.display === 'block' || lbAudioContainer.style.display === 'flex') return;
            e.preventDefault();
            const delta = -Math.sign(e.deltaY) * 0.5;
            const newScale = Math.min(Math.max(1, transformState.scale + delta), 5);
            transformState.scale = newScale;
            if(newScale === 1) { transformState.x = 0; transformState.y = 0; }
            updateTransform();
        }, { passive: false });

        let touchStart = { x: 0, y: 0 };
        
        lightbox.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStart.x = e.touches[0].clientX;
                touchStart.y = e.touches[0].clientY;
                startPos.x = transformState.x;
                startPos.y = transformState.y;
            }
        });

        lightbox.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                const dx = e.touches[0].clientX - touchStart.x;
                const dy = e.touches[0].clientY - touchStart.y;

                if (transformState.scale > 1) {
                    e.preventDefault();
                    transformState.x = startPos.x + dx;
                    transformState.y = startPos.y + dy;
                    updateTransform();
                }
            }
        }, { passive: false });

        lightbox.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1 && transformState.scale === 1) {
                const dx = e.changedTouches[0].clientX - touchStart.x;
                if (Math.abs(dx) > 50) {
                    changeMedia(dx > 0 ? -1 : 1);
                }
            }
        });

        function resetZoom() {
            transformState = { scale: 1, x: 0, y: 0 };
            updateTransform();
        }

        function updateTransform() {
            lbImg.style.transform = `translate(${transformState.x}px, ${transformState.y}px) scale(${transformState.scale})`;
        }
    </script>
</body>
</html>
