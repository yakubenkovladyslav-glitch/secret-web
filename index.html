<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Media Feed</title>
    <link rel="stylesheet" href="style.css">
    <!-- This loads your media_list.js generated by the Python script -->
    <script src="media_list.js"></script>
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Private Access</h2>
            <form onsubmit="handleLogin(event)">
                <input type="password" id="password-input" placeholder="Enter Password" autofocus>
                <button type="submit">Unlock</button>
            </form>
            <p id="error-msg" class="error-msg">Access Denied</p>
        </div>
    </div>

    <!-- HEADER / NAVIGATION (Hides automatically in landscape) -->
    <header id="main-header" style="display:none;">
        <div class="category-tabs">
            <button id="btn-images" class="tab-btn" onclick="filterMedia('images')">Images</button>
            <button id="btn-videos" class="tab-btn active" onclick="filterMedia('videos')">Videos</button>
        </div>
    </header>

    <!-- THE FEED -->
    <main id="gallery-content" style="display:none;">
        <div class="media-feed" id="feed-container"></div>
    </main>

    <script>
        const folderPath = "private-media/";
        // Password hash for "admin"
        const AUTH_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

        let filteredMediaList = [];
        const fileCategories = {
            images: ['jpg', 'jpeg', 'png', 'webp', 'gif'],
            videos: ['mp4', 'webm', 'mov', 'avi']
        };

        // --- URL CONVERTER ---
        function formatMediaURL(url) {
            if (!url.startsWith('http')) return folderPath + url;

            // YouTube Auto-Fix
            if (url.includes('youtube.com/watch?v=')) {
                const id = url.split('v=')[1].split('&')[0];
                return `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&enablejsapi=1`;
            }
            if (url.includes('youtu.be/')) {
                const id = url.split('/').pop();
                return `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&enablejsapi=1`;
            }

            // PH Auto-Fix
            if (url.includes('pornhub.com/view_video.php?viewkey=')) {
                const id = url.split('viewkey=')[1].split('&')[0];
                return `https://www.pornhub.com/embed/${id}`;
            }
            return url; 
        }

        function getFileType(filename) {
            if (filename.includes('youtube.com') || filename.includes('youtu.be') || filename.includes('pornhub.com')) return 'videos';
            const cleanName = filename.split('?')[0];
            const ext = cleanName.split('.').pop().toLowerCase();
            return fileCategories.images.includes(ext) ? 'images' : 'videos';
        }

        // --- AUTHENTICATION ---
        async function handleLogin(e) {
            e.preventDefault();
            const input = document.getElementById("password-input").value;
            const msgBuffer = new TextEncoder().encode(input);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashHex === AUTH_HASH) {
                document.getElementById("login-overlay").style.display = "none";
                document.getElementById("gallery-content").style.display = "block";
                document.getElementById("main-header").style.display = "block";
                loadGallery();
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function loadGallery() {
            filterMedia('videos');
        }

        function filterMedia(type) {
            window.scrollTo(0,0);
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');
            filteredMediaList = mediaList.filter(file => getFileType(file) === type);
            renderFeed();
        }

        // --- OBSERVER (Auto-play when scrolled to) ---
        const feedObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const media = entry.target;
                if (media.tagName === 'VIDEO') {
                    if (entry.isIntersecting) media.play().catch(()=>{});
                    else media.pause();
                }
                if (media.tagName === 'IFRAME') {
                    let src = media.src;
                    if (entry.isIntersecting) {
                        if (!src.includes('autoplay=1')) media.src += (src.includes('?') ? '&' : '?') + "autoplay=1&mute=1";
                    } else {
                        media.src = src.replace(/[&?]autoplay=1/, "").replace(/[&?]mute=1/, "");
                    }
                }
            });
        }, { threshold: 0.6 });

        function renderFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = ""; 

            filteredMediaList.forEach((filename) => {
                const card = document.createElement('div');
                card.className = 'feed-card';
                
                const fileType = getFileType(filename);
                const displayURL = formatMediaURL(filename);

                if (filename.includes('youtube.com') || filename.includes('pornhub.com')) {
                    const iframe = document.createElement('iframe');
                    iframe.src = displayURL;
                    iframe.allow = "autoplay; encrypted-media";
                    card.appendChild(iframe);
                    feedObserver.observe(iframe);
                } else if (fileType === 'videos') {
                    const vid = document.createElement('video');
                    vid.src = displayURL;
                    vid.loop = true;
                    vid.muted = true;
                    vid.playsInline = true;
                    vid.controls = true;
                    card.appendChild(vid);
                    feedObserver.observe(vid);
                } else {
                    const img = document.createElement('img');
                    img.src = displayURL;
                    card.appendChild(img);
                }
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
